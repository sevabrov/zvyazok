<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080610" />

    <!-- Primary SEO (defaults; kept in sync with the active language at runtime by i18n.ts) -->
    <title>Зв'язок</title>
    <meta
      name="description"
      content="Онлайн-гра для пар про розмови, ніжність і маленькі дії, які допомагають не загубити одне одного в житті, побуті й батьківстві."
    />
    <meta
      name="keywords"
      content="Зв'язок, гра для двох, гра для пари, онлайн гра, питання для пари"
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Зв'язок" />
    <meta
      property="og:description"
      content="Онлайн-гра для пар про розмови, ніжність і маленькі дії, які допомагають не загубити одне одного в житті, побуті й батьківстві."
    />
    <meta property="og:locale" content="uk" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Зв'язок" />
    <meta
      name="twitter:description"
      content="Онлайн-гра для пар про розмови, ніжність і маленькі дії, які допомагають не загубити одне одного в житті, побуті й батьківстві."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
